<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 with ELK Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js"></script>
</head>

<body>
    <div id="graph-container" style="width: 100%; height: 100vh;"></div>
    <script>
        const d2Script = `direction: down
        A -> B: "A to B"
        B -> C: "B to C"
        C -> D: "C to D"
        `;

        function convertD2ToELK(d2Script) {
            const lines = d2Script.trim().split('\n');
            const direction = lines[0].split(':')[1].trim();
            const nodes = new Set();
            console.log(lines.slice(1));
            const edges = lines.slice(1).map(line => {
                const [source, rest] = line.split('->').map(s => s.trim());
                const [target, label] = rest.split(':').map(s => s.trim().replace(/"/g, ''));
                console.log(source, target)
                nodes.add(source);
                nodes.add(target);
                return { id: `${source}-${target}`, sources: [source], targets: [target], labels: [{ text: label }] };
            });
            console.log(lines, direction, nodes, edges);

            return {
                id: "root",
                layoutOptions: { "elk.direction": direction.toUpperCase() },
                children: Array.from(nodes).map(id => ({ id, width: 100, height: 50 })),
                edges
            };
        }

        const elkGraph = convertD2ToELK(d2Script);

        const elk = new ELK();
        elk.layout(elkGraph)
            .then(layout => {
                const container = document.getElementById('graph-container');
                renderGraph(layout, container);
            })
            .catch(console.error);

        function renderGraph(layout, container) {
            container.innerHTML = '';
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');

            layout.children.forEach(node => {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', node.x);
                rect.setAttribute('y', node.y);
                rect.setAttribute('width', node.width);
                rect.setAttribute('height', node.height);
                rect.setAttribute('fill', '#1f77b4');
                svg.appendChild(rect);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', node.x + node.width / 2);
                text.setAttribute('y', node.y + node.height / 2);
                text.setAttribute('dominant-baseline', 'middle');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#fff');
                text.textContent = node.id;
                svg.appendChild(text);
            });

            layout.edges.forEach(edge => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                const sourceNode = layout.children.find(node => node.id === edge.sources[0]);
                const targetNode = layout.children.find(node => node.id === edge.targets[0]);
                line.setAttribute('x1', sourceNode.x + sourceNode.width / 2);
                line.setAttribute('y1', sourceNode.y + sourceNode.height / 2);
                line.setAttribute('x2', targetNode.x + targetNode.width / 2);
                line.setAttribute('y2', targetNode.y + targetNode.height / 2);
                line.setAttribute('stroke', '#000');
                svg.appendChild(line);

                if (edge.labels && edge.labels.length > 0) {
                    const label = edge.labels[0];
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    const midX = (sourceNode.x + targetNode.x + targetNode.width) / 2;
                    const midY = (sourceNode.y + targetNode.y + targetNode.height) / 2;
                    text.setAttribute('x', midX);
                    text.setAttribute('y', midY);
                    text.setAttribute('fill', '#000');
                    text.textContent = label.text;
                    svg.appendChild(text);
                }
            });

            container.appendChild(svg);
        }
    </script>
</body>

</html>
